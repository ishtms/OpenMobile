import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.result.ResolvedDependencyResult

def openMobileAdsAdMobMetaDependencies = [
    "com.google.ads.mediation:facebook": "6.22.0.0",
    "com.facebook.android:audience-network-sdk": "6.22.0",
    "com.google.ads.mediation:common": "1.1.0",
    "com.google.android.gms:play-services-ads": "25.4.0",
]

afterEvaluate {
    def manifestTasks = tasks.matching {
        it.name ==~ /^process.+ManifestForPackage$/
    }.toList()
    manifestTasks.each { manifestTask ->
        def match = manifestTask.name =~ /^process(.+)ManifestForPackage$/
        match.matches()
        def variantName = match.group(1)
        def configurationName =
            variantName.substring(0, 1).toLowerCase() + variantName.substring(1) +
            "RuntimeClasspath"
        def dependencyConfiguration = configurations.findByName(configurationName)
        def validationTask = tasks.register(
            "validateOpenMobileAdsAdMobMeta${variantName}Dependencies"
        ) {
            doLast {
                if (dependencyConfiguration == null) {
                    throw new GradleException(
                        "OpenMobile Ads AdMob Meta could not find Gradle configuration " +
                        "'${configurationName}'"
                    )
                }

                def requestedVersions = [:]
                def selectedVersions = [:]
                openMobileAdsAdMobMetaDependencies.keySet().each { coordinate ->
                    requestedVersions[coordinate] = [] as Set
                    selectedVersions[coordinate] = [] as Set
                }
                dependencyConfiguration.incoming.resolutionResult.allDependencies.each { dependency ->
                    def requested = dependency.requested
                    def requestedCoordinate = requested instanceof ModuleComponentSelector
                        ? "${requested.group}:${requested.module}"
                        : null
                    if (requestedCoordinate != null &&
                        openMobileAdsAdMobMetaDependencies.containsKey(requestedCoordinate)) {
                        def strictVersion = requested.versionConstraint.strictVersion
                        requestedVersions[requestedCoordinate].add(
                            strictVersion ?: requested.version
                        )
                    }
                    if (dependency instanceof ResolvedDependencyResult) {
                        def selected = dependency.selected.id
                        def selectedCoordinate = selected instanceof ModuleComponentIdentifier
                            ? "${selected.group}:${selected.module}"
                            : null
                        if (selectedCoordinate != null &&
                            openMobileAdsAdMobMetaDependencies.containsKey(selectedCoordinate)) {
                            selectedVersions[selectedCoordinate].add(selected.version)
                        }
                    }
                }

                def dependencyErrors = []
                openMobileAdsAdMobMetaDependencies.each { coordinate, expectedVersion ->
                    def unexpectedRequests = requestedVersions[coordinate].findAll {
                        it != expectedVersion
                    }
                    if (!unexpectedRequests.isEmpty()) {
                        dependencyErrors.add(
                            "${coordinate} has unsupported requested version(s) " +
                            "${unexpectedRequests.sort().join(', ')}; expected ${expectedVersion}"
                        )
                    }
                    if (selectedVersions[coordinate] != [expectedVersion] as Set) {
                        dependencyErrors.add(
                            "${coordinate} resolved to " +
                            "${selectedVersions[coordinate].sort().join(', ') ?: 'nothing'}; " +
                            "expected ${expectedVersion}"
                        )
                    }
                }

                if (!dependencyErrors.isEmpty()) {
                    throw new GradleException(
                        "OpenMobile Ads AdMob Meta Android dependency validation failed:\n - " +
                        dependencyErrors.join("\n - ")
                    )
                }
            }
        }
        tasks.matching {
            it.name == "package${variantName}" || it.name == "bundle${variantName}"
        }.configureEach {
            dependsOn validationTask
        }
        tasks.matching {
            it.name == "pre${variantName}Build"
        }.configureEach {
            dependsOn validationTask
        }
    }
}
